name: Run Pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: campus_square_test

        # Wait until postgres has fully started before moving on to the tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          DATABASE_HOSTNAME: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: campus_square_test

          # Dummy variables so Pydantic doesn't crash on startup
          SECRET_KEY: ""
          ALGORITHM: ""
          ACCESS_TOKEN_EXPIRE_MINUTES: 0
          REFRESH_TOKEN_EXPIRE_DAYS: 0
          SMTP_HOST: ""
          SMTP_PORT: 000
          SMTP_USERNAME: ""
          SMTP_PASSWORD: ""
          SMTP_FROM_EMAIL: ""
          ADMIN_ID: ""
          ADMIN_PASSWORD: ""
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
          FIREBASE_JSON_STR: "{}"

        run: |
          alembic upgrade head 
          pytest -v

name: Run Database Migrations (Neon)

on:
  push:
    branches:
      - main
    paths:
      - "alembic/**"
      - "alembic.ini"
      - "app/models/**"

  workflow_dispatch:
    inputs:
      action:
        description: "Alembic Action"
        required: true
        default: "upgrade"
        type: choice
        options:
          - upgrade
          - downgrade
      target:
        description: 'Target Revision (e.g., "head", "-1", "+1", "base", or specific revision_id)'
        required: true
        default: "head"
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Alembic Migration
        env:
          DATABASE_HOSTNAME: ${{ secrets.DATABASE_HOSTNAME }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_JSON_STR: ${{ secrets.FIREBASE_JSON_STR }}
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "Push event detected. Running automatic upgrade to head..."
            alembic upgrade head
          else
            echo "Manual workflow dispatch detected: Running 'alembic ${{ inputs.action }} ${{ inputs.target }}'"
            alembic ${{ inputs.action }} ${{ inputs.target }}
          fi
